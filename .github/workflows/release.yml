# Builds the plugin and publishes a release with an installable zip attached.
#
# Triggered by pushing a `v*` tag, or run by hand from the Actions tab to get a build
# artifact without cutting a release.
#
# WHY THE PRIVATE REFS REPO: a client plugin references ~20 assemblies and only 6 of them
# come from SPT. The other 14 are Escape From Tarkov's own DLLs, which BSG owns and which
# SPT itself refuses to redistribute (it ships a binary delta patch instead). They cannot
# live in this public repo, so they are kept in the private Dildz/spt-client-refs and
# pulled in here with a token. Nothing from them is ever published in the release zip.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      spt_version:
        description: "SPT version to build against (must exist under spt/ in spt-client-refs)"
        required: true
        default: "4.1.2"

permissions:
  contents: write

env:
  SPT_VERSION: ${{ inputs.spt_version || '4.1.2' }}
  PLUGIN_DIR: s8_SPT_LoadBundleEvenFaster

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Needs a fine-grained PAT with Contents: Read on Dildz/spt-client-refs,
      # stored in this repo as the REFS_TOKEN secret.
      - name: Fetch reference assemblies
        uses: actions/checkout@v4
        with:
          repository: Dildz/spt-client-refs
          token: ${{ secrets.REFS_TOKEN }}
          path: .refs

      - name: Assemble References/Client
        run: .refs/assemble-refs.sh "$SPT_VERSION" References/Client

      - name: Build
        run: dotnet build SPT_LoadBundleEvenFaster.Plugin/SPT_LoadBundleEvenFaster.Plugin.csproj -c Release

      # Only the plugin's own DLL ships. The build output also contains a copy of every
      # reference next to it, including the game's 16MB Assembly-CSharp.dll - shipping those
      # would both leak game files and make BepInEx load duplicate assemblies.
      - name: Stage the installable layout
        run: |
          set -euo pipefail
          stage="Package/BepInEx/plugins/${PLUGIN_DIR}"
          mkdir -p "$stage"
          cp SPT_LoadBundleEvenFaster.Plugin/bin/Release/netstandard2.1/SPT_LoadBundleEvenFaster.Plugin.dll "$stage/"
          find Package -type f | sort

      - name: Guard against leaking reference assemblies
        run: |
          set -euo pipefail
          leaked=$(find Package -name '*.dll' ! -name 'SPT_LoadBundleEvenFaster.Plugin.dll' | wc -l)
          if [ "$leaked" -ne 0 ]; then
            echo "FATAL: $leaked unexpected DLL(s) staged - refusing to publish" >&2
            find Package -name '*.dll' ! -name 'SPT_LoadBundleEvenFaster.Plugin.dll' >&2
            exit 1
          fi
          echo "OK: only the plugin DLL is staged"

      - name: Create zip
        run: |
          set -euo pipefail
          name="${PLUGIN_DIR}-${GITHUB_REF_NAME}-SPT${SPT_VERSION}.zip"
          cd Package && zip -r -9 "../$name" BepInEx && cd ..
          unzip -l "$name"
          echo "ZIP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_DIR }}-${{ env.SPT_VERSION }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          name: "SPT_LoadBundleEvenFaster ${{ github.ref_name }} (SPT ${{ env.SPT_VERSION }})"
          prerelease: ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-rc') }}
          # !!! UPDATE THIS BODY BEFORE TAGGING A NEW RELEASE !!!
          # It is baked in verbatim, so a stale body ships the previous version's notes.
          body: |
            Fork of [s8ga/SPT_LoadBundleEvenFaster](https://github.com/s8ga/SPT_LoadBundleEvenFaster), built against **SPT 4.1.2**. Plugin version **1.1.0**, from upstream's 1.0.1.

            ## Install

            Extract into your game folder so you end up with:

            ```
            BepInEx/plugins/s8_SPT_LoadBundleEvenFaster/SPT_LoadBundleEvenFaster.Plugin.dll
            ```

            ## What differs from upstream

            - **CRC validation concurrency is configurable.** Upstream hardcoded a cap of 8 threads regardless of CPU. This build exposes `MaxConcurrentCrcThreads` under `[Performance]` in the F12 config manager: `0` (default) uses every logical core, any other value is clamped to your real core count.
            - **A build fix for SPT 4.1**: the call to SPT's `Crc32.Update` is fully qualified, because the EFT client assembly declares its own `Crc32` in the global namespace and wins name lookup.

            ## Testing status

            Verified on a live **SPT 4.1.2** stack with a Fika headless client, which is a full SPT client and loads plugins exactly as a player client does:

            ```
            MaxConcurrentCrc set to 10 (configured: 0, CPU cores: 10)
            [Performance] Hooked into 'com.s8.sptpatchcrc32' native accelerator successfully!
            ValidateBundlesStreamingAsync: Starting parallel bundle validation for 25 bundles using Native PCLMULQDQ
            ValidateBundlesStreamingAsync: Validation completed. Valid: 25/25
            Init_Prefix: Validation succeeded! Fast path enabled. Bypassing SPT serial hash checks.
            ```

            All bundles validated, the fast path engaged, and no load errors. Note `CPU cores: 10` producing 10 concurrent tasks, where upstream would have capped at 8.

            **Not yet exercised across a full raid**, and not tested on hardware other than the machine above. If something misbehaves it will show up as slow or failed bundle loading at startup, so you will know quickly.

